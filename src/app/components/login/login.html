<div class="login-page">
  <app-toast></app-toast>
  <main class="login-container">
    <header class="login-brand">
      <img class="login-logo" src="" alt="Logo" width="112" height="112" />

      <h1>Bienvenida</h1>
      <p>Inicia sesión para entrar al taller.</p>
    </header>

    <form #loginForm="ngForm" (ngSubmit)="iniciarSesion()" class="login-form" novalidate>
      <div class="form-group">
        <label for="usuario">Usuario</label>

        <input
          id="usuario"
          type="text"
          name="usuario"
          [(ngModel)]="credenciales.usuario"
          placeholder="Ingrese su usuario"
          autocomplete="username"
          autocapitalize="off"
          spellcheck="false"
          required
        />
      </div>

      <div class="form-group">
        <label for="contrasena">Contraseña</label>

        <div class="password-wrapper">
          <input
            id="contrasena"
            name="contrasena"
            [type]="mostrarContrasena ? 'text' : 'password'"
            [(ngModel)]="credenciales.contrasena"
            placeholder="Ingrese su contraseña"
            autocomplete="current-password"
            required
          />

          <button
            type="button"
            class="password-toggle"
            (click)="mostrarContrasena = !mostrarContrasena"
            [attr.aria-label]="mostrarContrasena ? 'Ocultar contraseña' : 'Mostrar contraseña'"
            [attr.aria-pressed]="mostrarContrasena"
          >
            @if (mostrarContrasena) {
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-eye-off preview-icon"
              >
                <path
                  d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"
                />
                <path d="M14.084 14.158a3 3 0 0 1-4.242-4.242" />
                <path
                  d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"
                />
                <path d="m2 2 20 20" />
              </svg>
            } @else {
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-eye preview-icon"
              >
                <path
                  d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"
                />
                <circle cx="12" cy="12" r="3" />
              </svg>
            }
          </button>
        </div>
      </div>

      <button type="submit" class="login-button" [disabled]="loginForm.invalid || cargando">
        <span>Iniciar sesión</span>
      </button>
    </form>
  </main>
</div>
